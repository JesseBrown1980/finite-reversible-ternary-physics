name: Host8 Stage D CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-receipts-and-boundaries:
    name: Validate Host8 Receipts & Negative Regression Tests (CI Scope)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile native physics engine
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror asolaria_equilibrium_suite.cpp -o asolaria_equilibrium_suite

      - name: Run automated receipt and boundary tests (CI Fixtures)
        run: |
          pytest -v test_host8_receipts_and_boundaries.py
